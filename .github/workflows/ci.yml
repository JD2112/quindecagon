name: quindecagon CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install Development Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8

    - name: Check Code Formatting (Black)
      run: |
        black --check . --exclude "/(\.venv|\.git|site|quindecagon\.egg-info)/"

    - name: Lint Code Style (Flake8)
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,.git,site,quindecagon.egg-info
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv,.git,site,quindecagon.egg-info

    - name: Validate Editable Package Installation
      run: |
        pip install -e .
        python -c "import quindecagon; print('Rebranded package quindecagon installed successfully!')"
